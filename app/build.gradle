plugins {
    id 'com.android.application'
}

def traVersionName = project.findProperty("TRA_VERSION_NAME") ?: "1.0.0"
def traVersionCode = (project.findProperty("TRA_VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'za.co.theretrenchmentadventures.app'
    compileSdk 36

    defaultConfig {
        applicationId 'za.co.theretrenchmentadventures.app'
        minSdk 26
        targetSdk 36
        versionCode traVersionCode
        versionName traVersionName
    }

    signingConfigs {
        release {
            def keyFile = project.findProperty("TRA_KEYSTORE_FILE")
            if (keyFile) {
                storeFile file(keyFile)
                storePassword project.findProperty("TRA_KEYSTORE_PASSWORD")
                keyAlias project.findProperty("TRA_KEY_ALIAS")
                keyPassword project.findProperty("TRA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (project.findProperty("TRA_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
